# Environment profile: Linux, 2x RTX 3090 (24 GB each), ~128 GB RAM. The render farm.
name: linux_2x3090
hardware:
  gpus: ["RTX 3090", "RTX 3090"]
  vram_gb: 24
  ram_gb: 128
power_watts: 850                      # 2 x 350 W GPUs + ~150 W system under diffusion load
electricity_krw_per_kwh: 215

comfy:
  endpoints: ["http://127.0.0.1:8188", "http://127.0.0.1:8189"]   # one ComfyUI instance per GPU (systemd comfy@0, comfy@1)
  dual_instance: true                 # requires >= 64 GB RAM (two LTX-2.5 int8 sets resident); doctor checks this
  gpu_lease: true                     # POST /free on every endpoint before non-ComfyUI GPU stages
  models_dir: models                  # relative to the repo root (gitignored); one shared dir for all instances
  sage_attention: true
  quant: int8_convrot                 # Ampere: INT8 ConvRot (fp8 is not hardware-accelerated on RTX 30)

stages:
  keyframes:
    backend: comfy
    workflow: image_z_image_turbo
    model: z_image_turbo                # Apache; FLUX 3 Klein is optional until its license is confirmed
  video:
    backend: comfy
    model: ltx25
    workflow_i2v: video_ltx25_i2v
    workflow_flf2v: video_ltx25_flf2v
  tts:
    engine: kokoro                    # CPU; Fish Drama 3 (v1.5) needs gpu_lease
    device: cpu
  music:
    engine: none
  captions:
    timing_provider: engine
    style:
      font: "Liberation Sans"           # apt fonts-liberation (installed by scripts/setup_linux.sh); Arial Black is macOS-only
