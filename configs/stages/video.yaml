# Stage: video (Part B). Keyframe -> clip, one clip per SHOT. Shot lengths come from core/timeline.py.
backend: stub                   # stub | comfy | remote_comfy | ken_burns  (env profiles override)
model: ltx25                    # ltx25 | wan22
base_width: 544
base_height: 960
upscale: 2                      # latent 2x -> 1088x1920 -> crop 1080x1920
steps: 30
fps: 25
frame_grid: 8                   # LTX frame count must be 8k+1
max_clip_seconds: 10.0          # longer shots are split into equal I2V parts
native_audio: true              # keep LTX-2.5's generated sound as the diegetic track
sound_in_prompt: true           # append each shot's sound_prompt to the prompt ("Sound: hooves, wind")
sound_style: "only natural on-location sound, like a field recording"   # opens the Sound: sentence (steers away from score)
audio_negative: ""              # appended to the negative prompt; the distilled LTX samples at CFG 1, which ignores it
n_candidates: 1
timeout_seconds: 1800
retries: 1
fallback: ken_burns             # degraded path when a clip fails: pan/zoom over the keyframe
ken_burns:
  zoom_start: 1.0
  zoom_end: 1.12
  pre_scale: 1.6
# ---- edit pacing (applies to every topic) ----
first_pre_roll: 0.3             # silence before the very first line
pre_roll: 0.12                  # breath before each later line
post_roll: 0.25                 # breath after each line (beats add their own dramatic pause_after)
min_shot_seconds: 1.6           # a beat too short for its shots drops the extra ones
transitions:                    # seconds; cut = 1-frame join used between shots inside a beat
  cut: 0.04
  fade: 0.35
  fadeblack: 0.6
  flash: 0.25
