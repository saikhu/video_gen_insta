# Stage: research. Islamic: cited fact sheet from the local corpus. Memes: original idea pool.
backend: local                  # local (Ollama, configs/llm.yaml) | claude (needs ANTHROPIC_API_KEY) | stub
model: claude-opus-5-5          # only used by backend: claude (configs/llm.yaml claude.model wins)
effort: high
max_tokens: 16000
max_chunks: 24                  # corpus chunks for claude; the local model uses llm.yaml local.research_max_chunks
chunk_chars: 3000
min_chunk_score: 1              # keyword hits required for a chunk to be included
ideas_per_run: 20               # memes only
